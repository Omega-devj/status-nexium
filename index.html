<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statut · Nexium Client</title>
<meta name="description" content="Etat des services du Nexium Client : mise a jour, protection des liens, signalements.">
<style>
  :root{
    --fond:#0b0b0c; --carte:#121214; --carte2:#17171a; --ligne:#26262b;
    --texte:#ececee; --doux:#9a9aa4; --faible:#6a6a73;
    --or:#e6c48a; --vert:#5fb37a; --ambre:#d9a441; --rouge:#d6484a; --gris:#3a3a41;
    --r:14px;
  }
  @media (prefers-color-scheme: light){
    :root{ --fond:#f7f7f8; --carte:#fff; --carte2:#fafafb; --ligne:#e4e4e8;
           --texte:#1a1a1d; --doux:#5e5e68; --faible:#8a8a94; --or:#9a7318; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--texte);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .env{max-width:900px;margin:0 auto;padding:40px 20px 80px}
  a{color:var(--or)}

  header{display:flex;align-items:center;gap:12px;margin-bottom:32px}
  .marque{font-weight:800;letter-spacing:.02em;font-size:17px}
  .marque span{color:var(--or)}
  header .lien{margin-left:auto;font-size:13px;color:var(--doux);text-decoration:none}
  header .lien:hover{color:var(--texte)}

  .banniere{border-radius:var(--r);padding:24px 26px;margin-bottom:14px;
    border:1px solid var(--ligne);background:var(--carte);display:flex;gap:18px;align-items:center}
  .banniere .rond{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center}
  .banniere h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .banniere p{margin:3px 0 0;color:var(--doux);font-size:13px}
  .b-operationnel{border-color:rgba(95,179,122,.4)} .b-operationnel .rond{background:rgba(95,179,122,.16);color:var(--vert)}
  .b-degrade{border-color:rgba(217,164,65,.45)} .b-degrade .rond{background:rgba(217,164,65,.16);color:var(--ambre)}
  .b-panne{border-color:rgba(214,72,74,.5)} .b-panne .rond{background:rgba(214,72,74,.16);color:var(--rouge)}
  .b-inconnu .rond{background:var(--gris);color:var(--doux)}

  h2{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faible);margin:34px 0 12px}

  .carte{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);overflow:hidden}
  .comp{padding:16px 20px;border-bottom:1px solid var(--ligne)}
  .comp:last-child{border-bottom:none}
  .comp-tete{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .comp-nom{font-weight:600}
  .comp-detail{color:var(--faible);font-size:12.5px}
  .comp-etat{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
  .e-operationnel{color:var(--vert)} .e-degrade{color:var(--ambre)} .e-panne{color:var(--rouge)}
  .comp-info{color:var(--doux);font-size:12.5px;margin-top:3px}

  .barres{display:flex;gap:2px;margin-top:12px;height:30px;align-items:stretch}
  .barre{flex:1 1 0;min-width:2px;border-radius:2px;background:var(--gris);position:relative}
  .barre.ok{background:var(--vert)} .barre.mix{background:var(--ambre)} .barre.ko{background:var(--rouge)}
  .barre:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% + 7px);left:50%;
    transform:translateX(-50%);background:var(--carte2);border:1px solid var(--ligne);
    color:var(--texte);font-size:11.5px;white-space:nowrap;padding:5px 9px;border-radius:7px;z-index:5;
    box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .echelle{display:flex;justify-content:space-between;color:var(--faible);font-size:11.5px;margin-top:6px}

  .inc{padding:18px 20px;border-bottom:1px solid var(--ligne)}
  .inc:last-child{border-bottom:none}
  .inc-tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .puce{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    padding:3px 9px;border-radius:99px;border:1px solid}
  .g-critique{color:var(--rouge);border-color:rgba(214,72,74,.5);background:rgba(214,72,74,.1)}
  .g-majeur{color:var(--ambre);border-color:rgba(217,164,65,.5);background:rgba(217,164,65,.1)}
  .g-mineur{color:var(--doux);border-color:var(--ligne)}
  .g-resolu{color:var(--vert);border-color:rgba(95,179,122,.45);background:rgba(95,179,122,.1)}
  .inc h3{margin:0;font-size:15.5px;font-weight:650}
  .inc-date{color:var(--faible);font-size:12px;margin-left:auto}
  .inc-resume{color:var(--doux);font-size:13.5px;margin:8px 0 0}
  .maj{margin:12px 0 0;padding:0 0 0 16px;border-left:2px solid var(--ligne);list-style:none}
  .maj li{margin:0 0 9px;font-size:13px;color:var(--doux)}
  .maj li:last-child{margin-bottom:0}
  .maj b{color:var(--texte);font-weight:650;text-transform:uppercase;font-size:10.5px;letter-spacing:.08em}
  .maj time{color:var(--faible);font-size:11.5px;margin-left:6px}

  .vide{padding:26px 20px;color:var(--faible);font-size:13.5px;text-align:center}
  footer{margin-top:38px;color:var(--faible);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  footer a{color:var(--doux)}
  .pastille{width:7px;height:7px;border-radius:50%;background:var(--vert);display:inline-block;margin-right:6px}
  @media (max-width:560px){ .comp-etat{margin-left:0;width:100%} .inc-date{margin-left:0;width:100%} }
</style>
</head>
<body>
<div class="env">

  <header>
    <div class="marque">NEXIUM <span>· Statut</span></div>
    <a class="lien" href="https://github.com/Omega-devj/nexium-client" target="_blank" rel="noopener">Le client ↗</a>
  </header>

  <div id="banniere" class="banniere b-inconnu">
    <div class="rond" id="icone">…</div>
    <div>
      <h1 id="titre">Lecture de l etat…</h1>
      <p id="sous">Interrogation du depot de statut</p>
    </div>
  </div>

  <div id="zone-ouverts"></div>

  <h2>Services</h2>
  <div class="carte" id="composants">
    <div class="vide">Chargement…</div>
  </div>

  <h2>Historique des incidents</h2>
  <div class="carte" id="historique">
    <div class="vide">Chargement…</div>
  </div>

  <footer>
    <span><span class="pastille"></span><span id="maj">—</span></span>
    <span>·</span>
    <span>Verification automatique toutes les 5 minutes</span>
    <span>·</span>
    <a href="https://github.com/Omega-devj/status-nexium" target="_blank" rel="noopener">Source</a>
  </footer>
</div>

<script>
(function () {
  var ICONES = { operationnel: '✔', degrade: '!', panne: '×', inconnu: '…' };
  var MOTS = {
    operationnel: 'Tous les services sont operationnels',
    degrade: 'Service degrade',
    panne: 'Panne en cours',
    inconnu: 'Etat indisponible'
  };
  var COURT = { operationnel: 'Operationnel', degrade: 'Degrade', panne: 'Panne', inconnu: 'Inconnu' };
  var ETATINC = { enquete: 'En cours d analyse', identifie: 'Cause identifiee', surveille: 'Sous surveillance', resolu: 'Resolu' };

  function e(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }
  function dt(s) { try { return new Date(s).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' }); } catch (_) { return s; } }
  function dj(s) { try { return new Date(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (_) { return s; } }
  function ecoule(s) {
    var d = Math.round((Date.now() - new Date(s).getTime()) / 1000);
    if (d < 90) return 'il y a ' + d + ' s';
    if (d < 5400) return 'il y a ' + Math.round(d / 60) + ' min';
    if (d < 172800) return 'il y a ' + Math.round(d / 3600) + ' h';
    return 'il y a ' + Math.round(d / 86400) + ' j';
  }

  function banniere(etat, resume) {
    var b = document.getElementById('banniere');
    b.className = 'banniere b-' + (ICONES[etat] ? etat : 'inconnu');
    document.getElementById('icone').textContent = ICONES[etat] || ICONES.inconnu;
    document.getElementById('titre').textContent = MOTS[etat] || MOTS.inconnu;
    document.getElementById('sous').textContent = resume || '';
  }

  function barres(cle, histo) {
    var h = (histo && histo[cle]) || {};
    var enveloppe = e('div');
    var ligne = e('div', 'barres');
    var jours = 90, vus = 0;
    for (var i = jours - 1; i >= 0; i--) {
      var d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
      var c = h[d], b = e('div', 'barre');
      if (c) {
        vus++;
        var tot = c.ok + c.degrade + c.panne;
        if (c.panne) b.className = 'barre ko';
        else if (c.degrade) b.className = 'barre mix';
        else b.className = 'barre ok';
        b.setAttribute('data-t', dj(d) + ' · ' + Math.round(c.ok / tot * 100) + '% operationnel');
      } else {
        b.setAttribute('data-t', dj(d) + ' · aucune donnee');
      }
      ligne.appendChild(b);
    }
    enveloppe.appendChild(ligne);
    var ech = e('div', 'echelle');
    ech.appendChild(e('span', null, vus > 1 ? 'il y a 90 jours' : 'surveillance demarree'));
    ech.appendChild(e('span', null, 'aujourd hui'));
    enveloppe.appendChild(ech);
    return enveloppe;
  }

  function rendreComposants(s, histo) {
    var z = document.getElementById('composants');
    z.innerHTML = '';
    (s.composants || []).forEach(function (c) {
      var d = e('div', 'comp');
      var t = e('div', 'comp-tete');
      t.appendChild(e('span', 'comp-nom', c.nom));
      if (c.detail) t.appendChild(e('span', 'comp-detail', c.detail));
      t.appendChild(e('span', 'comp-etat e-' + c.etat, COURT[c.etat] || c.etat));
      d.appendChild(t);
      var info = c.pourquoi || c.info;
      if (info) d.appendChild(e('div', 'comp-info', info + (c.latenceMs != null ? ' · ' + c.latenceMs + ' ms' : '')));
      d.appendChild(barres(c.cle, histo));
      z.appendChild(d);
    });
    if (!z.children.length) z.appendChild(e('div', 'vide', 'Aucun service declare.'));
  }

  function carteIncident(i) {
    var d = e('div', 'inc');
    var t = e('div', 'inc-tete');
    var resolu = !!i.fin || i.etat === 'resolu';
    t.appendChild(e('span', 'puce ' + (resolu ? 'g-resolu' : 'g-' + (i.gravite || 'mineur')), resolu ? 'Resolu' : (i.gravite || 'mineur')));
    t.appendChild(e('h3', null, i.titre));
    t.appendChild(e('span', 'inc-date', dj(i.debut)));
    d.appendChild(t);
    if (i.resume) d.appendChild(e('p', 'inc-resume', i.resume));
    if (i.maj && i.maj.length) {
      var ul = e('ul', 'maj');
      i.maj.slice().reverse().forEach(function (m) {
        var li = e('li');
        li.appendChild(e('b', null, ETATINC[m.etat] || m.etat || 'Mise a jour'));
        li.appendChild(e('time', null, dt(m.a)));
        li.appendChild(e('div', null, m.texte));
        ul.appendChild(li);
      });
      d.appendChild(ul);
    }
    return d;
  }

  function rendreIncidents(s) {
    var ouverts = (s.incidents || []).filter(function (i) { return !i.fin && i.etat !== 'resolu'; });
    var passes = (s.incidents || []).filter(function (i) { return i.fin || i.etat === 'resolu'; });

    var zo = document.getElementById('zone-ouverts');
    zo.innerHTML = '';
    if (ouverts.length) {
      zo.appendChild(e('h2', null, ouverts.length > 1 ? 'Incidents en cours' : 'Incident en cours'));
      var c = e('div', 'carte');
      ouverts.forEach(function (i) { c.appendChild(carteIncident(i)); });
      zo.appendChild(c);
    }

    var zh = document.getElementById('historique');
    zh.innerHTML = '';
    if (!passes.length) zh.appendChild(e('div', 'vide', 'Aucun incident enregistre.'));
    else passes.slice(0, 25).forEach(function (i) { zh.appendChild(carteIncident(i)); });
  }

  function charger() {
    var q = '?t=' + Date.now();
    Promise.all([
      fetch('status.json' + q, { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('history.json' + q, { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return {}; })
    ]).then(function (res) {
      var s = res[0], histo = res[1];
      var n = (s.composants || []).length;
      banniere(s.etat, s.etat === 'operationnel'
        ? n + ' service' + (n > 1 ? 's' : '') + ' surveille' + (n > 1 ? 's' : '') + ' · verifie ' + ecoule(s.genereA)
        : s.resume);
      rendreComposants(s, histo);
      rendreIncidents(s);
      document.getElementById('maj').textContent = 'Derniere verification ' + ecoule(s.genereA);
      document.title = (s.etat === 'operationnel' ? '' : '● ') + 'Statut · Nexium Client';
    }).catch(function () {
      banniere('inconnu', 'Impossible de lire le fichier de statut. Le depot est peut-etre inaccessible.');
      document.getElementById('composants').innerHTML = '<div class="vide">Etat indisponible.</div>';
      document.getElementById('historique').innerHTML = '<div class="vide">Etat indisponible.</div>';
    });
  }

  charger();
  setInterval(charger, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) charger(); });
})();
</script>
</body>
</html>
